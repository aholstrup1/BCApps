name: Copilot code review setup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Install BCQuality plugin
        shell: bash
        run: |
          copilot plugin marketplace add aholstrup1/BCQuality#9bb4cd53ddce110e3a532ba6c539024449fae29b
          copilot plugin install bcquality@bcquality
          copilot plugin list
