name: Copilot Code Review Setup

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - .github/workflows/copilot-code-review.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - .github/workflows/copilot-code-review.yml

permissions:
  contents: read

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Install BCQuality plugin
        shell: bash
        run: |
          set -euxo pipefail
          copilot --version
          copilot plugin marketplace add aholstrup1/BCQuality#9bb4cd53ddce110e3a532ba6c539024449fae29b
          copilot plugin install bcquality@bcquality
          copilot plugin list
